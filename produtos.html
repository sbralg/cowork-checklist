<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produtos">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Produtos</title>
<!--
  Data-free shell for the product catalogue. Same pattern as the other
  pages: hosted on public GitHub Pages, holds NO keys and NO data, asks for
  the shared passphrase, then talks only to the gated Supabase Edge Function
  (checklist-api).

  This page is the REFERENCE side of the catalogue — what a barcode means,
  what it costs over time, and where its metadata gets corrected. The
  PANTRY side (how many are in the cupboard, and changing that) is
  estoque.html. Both read the same `products` action and both link to each
  other; the split is that this one is read-mostly and alphabetical, while
  the other is state that changes daily and sorts by what is running out.
-->
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --text:#1a1a1a; --muted:#6b7280;
    --border:#e5e7eb; --border-strong:#d1d5db; --accent:#2563eb;
    --accent-text:#ffffff; --danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
      --border:#334155; --border-strong:#475569; --accent:#3b82f6;
      --accent-text:#ffffff; --danger:#f87171;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 8px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  .subheader{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;margin:0 0 16px}
  .list-title{display:flex;align-items:baseline;gap:8px;min-width:0}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h2{font-size:17px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h3{font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--muted)}
  .link{
    background:none;border:none;color:var(--muted);font-size:13px;padding:4px;cursor:pointer;
    text-decoration:none;display:inline-block;transition:color .15s ease,opacity .1s ease;
  }
  .link:hover{color:var(--text);text-decoration:underline}
  .link:active{opacity:.6}
  .menu-btn{
    background:none;border:none;color:var(--text);font-size:22px;padding:2px 8px 2px 0;
    cursor:pointer;line-height:1;flex:none;align-self:center;
    transition:opacity .15s ease,transform .1s ease;
  }
  .menu-btn:hover{opacity:.7}
  .menu-btn:active{transform:scale(.9)}
  .menu-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
    animation:modalFadeIn .15s ease;
  }
  .menu-panel{
    position:fixed;top:0;left:0;bottom:0;width:min(280px,80vw);
    background:var(--card);box-shadow:2px 0 24px rgba(0,0,0,.3);
    display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 0 max(16px,env(safe-area-inset-bottom));
    transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .menu-panel.open{transform:translateX(0)}
  .menu-item{
    display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:15px;
    color:var(--text);text-decoration:none;background:none;border:none;width:100%;
    text-align:left;cursor:pointer;transition:background-color .15s ease;
  }
  .menu-item:hover{background:rgba(127,127,127,.08)}
  .menu-item.active{color:var(--accent);font-weight:600}
  .menu-spacer{flex:1}
  .menu-item.logout{border-top:1px solid var(--border);color:var(--danger)}
  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:16px;padding:6px;cursor:pointer;
    flex:none;line-height:1;border-radius:8px;
    transition:background-color .15s ease,color .15s ease,transform .1s ease;
  }
  .icon-btn:hover{background:rgba(127,127,127,.15);color:var(--text)}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn.danger{color:var(--danger)}
  .icon-btn.danger:hover{background:rgba(220,38,38,.15);color:var(--danger)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .card.pad{padding:16px}
  .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background-color .15s ease}
  .row:hover{background:rgba(127,127,127,.06)}
  .row:last-child{border-bottom:none}
  .body{min-width:0;flex:1}
  .body .txt{font-size:15px;line-height:1.35;margin:0;word-wrap:break-word}
  .body .meta{font-size:12px;color:var(--muted);margin:3px 0 0}
  /* Product thumbnail. Open Food Facts supplies a front-of-pack image for
     most food; a hand-registered product has none, so the box emoji is the
     placeholder rather than a broken-image icon. */
  .thumb{
    width:44px;height:44px;flex:none;border-radius:10px;object-fit:contain;
    background:rgba(127,127,127,.08);border:1px solid var(--border);
  }
  .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:20px}
  /* How many packages are in the cupboard. Zero is a real, ordinary answer
     — the product is in the catalogue and out of stock — so it is muted
     rather than alarming. */
  .stock-badge{
    flex:none;font-size:12px;font-weight:650;padding:5px 9px;border-radius:999px;
    background:rgba(127,127,127,.12);color:var(--muted);white-space:nowrap;
  }
  .stock-badge.has{background:rgba(37,99,235,.14);color:var(--accent)}
  /* What a product IS, as opposed to which SKU it is — the link a recipe
     reads. Shown on every catalogue row, including when it is missing:
     "sem ingrediente" is muted rather than alarming, exactly like the
     missing-barcode marker on the shopping list, because an uncategorised
     product is normal today. Seeing which rows are blank is what makes a
     categorising pass down the list possible at all. */
  .ing-tag{
    display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
    background:rgba(37,99,235,.12);color:var(--accent);margin:5px 0 0;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ing-tag.none{background:rgba(127,127,127,.12);color:var(--muted)}
  .msg{padding:28px 8px;text-align:center;color:var(--muted);font-size:15px}
  .msg.err{color:var(--danger)}
  .msg.small{padding:16px 8px;font-size:14px}
  .login{max-width:360px;margin:12vh auto 0;text-align:center}
  .login h2{font-size:18px;margin:0 0 4px}
  .login p{color:var(--muted);font-size:14px;margin:0 0 20px}
  input[type=password]{
    width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);margin-bottom:12px;
  }
  button.primary{
    font:inherit;font-weight:600;font-size:16px;border:none;border-radius:14px;
    padding:15px 20px;min-height:52px;cursor:pointer;width:100%;max-width:640px;
    background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s ease,transform .1s ease;
  }
  button.primary:hover:not(:disabled){filter:brightness(1.1)}
  button.primary:active:not(:disabled){transform:scale(.98)}
  button.primary:disabled{opacity:.5}
  button.primary.small{min-height:44px;padding:10px 16px;font-size:14px;width:auto;flex:none}
  button.primary.alt{background:rgba(127,127,127,.16);color:var(--text)}
  button.primary.alt:hover:not(:disabled){background:rgba(127,127,127,.26);filter:none}
  button.primary.alt.danger{color:var(--danger)}
  button.primary.alt.danger:hover:not(:disabled){background:rgba(220,38,38,.14)}
  .loginerr{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}
  .searchrow{display:flex;gap:8px;margin:0 0 14px}
  .searchrow input[type=search]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    -webkit-appearance:none;
  }
  /* ---- product detail ---- */
  .prod-head{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
  .prod-head .thumb{width:72px;height:72px}
  .prod-title{min-width:0;flex:1}
  .prod-title .name{font-size:17px;font-weight:650;margin:0;word-wrap:break-word}
  .prod-title .sub{font-size:13px;color:var(--muted);margin:4px 0 0}
  .prod-title .code{font-size:12px;color:var(--muted);margin:6px 0 0;font-variant-numeric:tabular-nums}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* Why a row is a manual placeholder instead of real OFF data: OFF
     genuinely doesn't have the barcode, or the lookup itself never got an
     answer (e.g. mid-outage). Both get a retry — contributing to OFF or the
     outage clearing are both things this page can't detect on its own,
     short of asking again. */
  .off-flag{
    display:flex;align-items:flex-start;gap:10px;margin:14px 0 0;
    padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45;
    background:rgba(127,127,127,.08);border:1px solid var(--border);
  }
  .off-flag .icon{flex:none;font-size:16px}
  .off-flag .body{flex:1;min-width:0}
  .off-flag .body p{margin:0 0 10px}
  .off-flag .actions{display:flex;gap:8px;flex-wrap:wrap}
  .off-flag .actions a, .off-flag .actions button{
    font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    text-decoration:none;cursor:pointer;transition:background-color .15s ease;
  }
  .off-flag .actions a:hover, .off-flag .actions button:hover:not(:disabled){
    background:rgba(127,127,127,.12);
  }
  .off-flag .actions button:disabled{opacity:.5;cursor:default}
  /* Muted, same convention as shopping.html's missing-barcode marker — a
     manual placeholder is normal, not alarming. */
  .flag-ic{font-size:12px;margin-right:3px}
  .stock-line{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    border-top:1px solid var(--border);margin-top:14px;padding-top:14px;
  }
  .stock-line .big{font-size:20px;font-weight:650}
  .stock-line .sub{font-size:12px;color:var(--muted);margin:2px 0 0}
  /* The ingredient line sits with the pantry count rather than inside the
     metadata editor: it is not a fact about the package, it is what this
     product counts AS. Same divider treatment so the two read as one block
     of "what this is". */
  .ing-line{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    border-top:1px solid var(--border);margin-top:14px;padding-top:14px;
  }
  .ing-line .lbl{font-size:12px;color:var(--muted);margin:0}
  .ing-line .val{font-size:16px;font-weight:650;margin:2px 0 0}
  .ing-line .val.none{font-weight:400;color:var(--muted)}
  /* ---- ingredient picker ---- */
  .ing-list{max-height:44vh;overflow-y:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
  .ing-opt{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    color:var(--text);font:inherit;font-size:15px;padding:11px 4px;cursor:pointer;
    transition:background-color .15s ease;
  }
  .ing-opt:last-child{border-bottom:none}
  .ing-opt:hover{background:rgba(127,127,127,.08)}
  .ing-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ing-opt .cnt{font-size:12px;color:var(--muted);flex:none}
  .ing-opt.current{color:var(--accent);font-weight:650}
  .ing-opt.create{color:var(--accent)}
  .ing-opt.clear{color:var(--muted)}
  /* Ranked to the top when a word of the product's name matches an existing
     ingredient — the household's own catalogue is a better guide to "is this
     the same thing?" than any external category tree. */
  .ing-opt .hintbadge{
    font-size:11px;padding:2px 7px;border-radius:999px;flex:none;
    background:rgba(37,99,235,.14);color:var(--accent);
  }
  /* ---- price history ----
     One series, so no legend: the section heading names it. The line wears
     the accent; every number and label stays in text ink, so identity never
     rests on colour alone. The list underneath is the table view of the
     same data. */
  /* height:auto with a uniformly-scaled viewBox, NOT a fixed height with
     preserveAspectRatio="none" — stretching the viewBox to the card's width
     stretches the text inside it too, and the labels come out visibly wide. */
  .chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
  .chart .grid{stroke:var(--border);stroke-width:1}
  .chart .axis{stroke:var(--border-strong);stroke-width:1}
  .chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
  .chart .hit{fill:transparent}
  .chart .lbl{fill:var(--muted);font-size:10px}
  .chart .lbl.val{fill:var(--text);font-size:11px;font-weight:650}
  .chart-wrap{position:relative}
  .chart-tip{
    position:absolute;pointer-events:none;transform:translate(-50%,-100%);
    background:var(--text);color:var(--bg);font-size:12px;font-weight:600;
    padding:5px 8px;border-radius:8px;white-space:nowrap;opacity:0;
    transition:opacity .12s ease;
  }
  .chart-tip.show{opacity:1}
  .plist{font-size:13px}
  .plist .prow{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border)}
  .plist .prow:last-child{border-bottom:none}
  .plist .when{color:var(--muted)}
  .plist .amount{font-weight:650;white-space:nowrap}
  /* ---- movement ledger ---- */
  .mov{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
  .mov:last-child{border-bottom:none}
  .mov .delta{
    flex:none;width:44px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums;
  }
  .mov .delta.up{color:var(--accent)}
  .mov .delta.down{color:var(--muted)}
  .mov .what{flex:1;min-width:0}
  .mov .what .when{font-size:12px;color:var(--muted);margin:2px 0 0}
  /* An entry that exists only because stock was missing when something was
     used — the shopping list never recorded that purchase. Worth marking:
     it is the one movement the user did not deliberately make. */
  .mov .tag{
    display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;margin-left:6px;
    background:rgba(127,127,127,.14);color:var(--muted);
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:16px;
    animation:modalFadeIn .15s ease;
  }
  .modal-card{
    background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;
    animation:modalPopIn .18s cubic-bezier(.2,.8,.2,1);
    max-height:90vh;overflow:auto;
  }
  @keyframes modalFadeIn{from{opacity:0} to{opacity:1}}
  @keyframes modalPopIn{
    from{opacity:0;transform:scale(.95) translateY(6px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }
  .modal-card h3{margin:0 0 14px;font-size:16px;color:var(--text)}
  .modal-card p{font-size:15px;line-height:1.4;margin:0 0 18px}
  .modal-card label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  /* Excludes .num-input for the same reason shopping.html does: the compact
     amount control is type=text too, and this rule outranks .num-input. */
  .modal-card input[type=text]:not(.num-input){
    width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);margin-bottom:14px;
  }
  .modal-card .hint{font-size:12px;color:var(--muted);line-height:1.4;margin:-6px 0 16px}
  .modal-card select{
    font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  .field{display:flex;align-items:center;flex:none}
  .num-input{
    width:70px;flex:none;font:inherit;font-size:14px;padding:8px;
    border:1px solid var(--border-strong);border-radius:8px;
    background:var(--card);color:var(--text);text-align:right;
  }
  .pack-fields{display:flex;gap:12px;align-items:flex-end;margin:0 0 6px}
  .pack-fields .col{display:flex;flex-direction:column;gap:6px;min-width:0}
  .pack-fields .col.grow{flex:1}
  .pack-fields .col.grow .field{width:100%}
  .pack-fields .col.grow .num-input{flex:1 1 auto;width:auto;min-width:0}
  .pack-fields label{margin:0;font-size:13px;color:var(--muted)}
  .pack-fields .unit-col select{width:84px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .modal-actions button{
    font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;
    border:none;cursor:pointer;transition:filter .15s ease,transform .1s ease,background-color .15s ease;
  }
  .modal-actions button:active{transform:scale(.97)}
  .modal-actions .cancel{background:none;color:var(--muted)}
  .modal-actions .cancel:hover{background:rgba(127,127,127,.12);color:var(--text)}
  .modal-actions .save{background:var(--accent);color:var(--accent-text)}
  .modal-actions .save.danger{background:var(--danger)}
  .modal-actions .save:hover{filter:brightness(1.1)}
  .toast{
    position:fixed;left:16px;right:16px;
    bottom:max(16px,env(safe-area-inset-bottom));
    margin:0 auto;max-width:420px;text-align:center;z-index:95;
    background:var(--text);color:var(--bg);
    font-size:14px;font-weight:600;padding:12px 14px;border-radius:12px;
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:var(--danger);color:#fff}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const API = "https://opehbckfmfschpvbhxvo.supabase.co/functions/v1/checklist-api";
const PASS_KEY = "checklist_pass";

const root = document.getElementById("root");
// The whole catalogue, loaded once per page view and filtered in the
// browser. Kept at module scope so returning from a product's detail sheet
// doesn't refetch it.
let catalog = [];
let searchTerm = "";

function getPass(){ return localStorage.getItem(PASS_KEY) || ""; }

async function api(action, extra){
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-checklist-pass": getPass() },
    body: JSON.stringify(Object.assign({ action }, extra || {}))
  });
  if(r.status === 401){ const e = new Error("unauthorized"); e.unauthorized = true; throw e; }
  if(!r.ok){
    // 400 means the API rejected the input itself, which deserves a
    // different message from a connection failure.
    const e = new Error("http " + r.status);
    e.badRequest = r.status === 400;
    throw e;
  }
  return await r.json();
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function fmtMoney(v){
  return new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" }).format(Number(v) || 0);
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return Number.isNaN(d.getTime())
    ? ""
    : d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function fmtDateTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return Number.isNaN(d.getTime())
    ? ""
    : d.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
}

const CURRENT_PAGE = "produtos";
const MENU_ITEMS = [
  { page: "hoje", href: "hoje.html", emoji: "☀️", label: "Hoje" },
  { page: "index", href: "index.html", emoji: "✓", label: "Tarefas" },
  { page: "shopping", href: "shopping.html", emoji: "🛒", label: "Compras" },
  { page: "estoque", href: "estoque.html", emoji: "📦", label: "Estoque" },
  { page: "produtos", href: "produtos.html", emoji: "🏷️", label: "Produtos" },
];

function wireMenuButton(){
  const btn = document.getElementById("menu-btn");
  if(btn) btn.addEventListener("click", openMenu);
}

function openMenu(){
  const itemsHtml = MENU_ITEMS.map(item => {
    if(item.page === CURRENT_PAGE){
      return '<span class="menu-item active">' + item.emoji + ' ' + item.label + '</span>';
    }
    return '<a class="menu-item" href="' + item.href + '">' + item.emoji + ' ' + item.label + '</a>';
  }).join("");

  const backdrop = document.createElement("div");
  backdrop.className = "menu-backdrop";
  backdrop.innerHTML =
    '<div class="menu-panel" id="menu-panel">' +
      itemsHtml +
      '<div class="menu-spacer"></div>' +
      '<button class="menu-item logout" id="menu-logout">🚪 Sair</button>' +
    '</div>';
  document.body.appendChild(backdrop);
  const panel = document.getElementById("menu-panel");
  requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("open")));

  const close = () => {
    panel.classList.remove("open");
    document.removeEventListener("keydown", onKey);
    setTimeout(() => backdrop.remove(), 250);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  document.getElementById("menu-logout").addEventListener("click", () => {
    localStorage.removeItem(PASS_KEY);
    close();
    showLogin();
  });
}

function confirmModal(message, confirmLabel){
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<p>' + esc(message) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="confirm-cancel">Cancelar</button>' +
          '<button class="save danger" id="confirm-ok">' + esc(confirmLabel || "Excluir") + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    function onKey(e){ if(e.key === "Escape") close(false); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(false); });
    document.getElementById("confirm-cancel").addEventListener("click", () => close(false));
    document.getElementById("confirm-ok").addEventListener("click", () => close(true));
  });
}

let listToastTimer = null;
function listToast(msg, isErr){
  let el = document.getElementById("list-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "list-toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(listToastTimer);
  listToastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ---- shared formatting (duplicated verbatim from shopping.html) ----

// Quantity for display: "2", not "2,00" — but "1,5" stays "1,5".
function fmtQty(q){
  const n = Number(q);
  if(!Number.isFinite(n)) return "0";
  return Number.isInteger(n) ? String(n) : n.toLocaleString("pt-BR");
}

// Package size as stored: normalized to g / ml / un by the API, shown back
// in whichever unit reads naturally.
function fmtNetQty(qty, unit){
  const n = Number(qty);
  if(!Number.isFinite(n) || n <= 0 || !unit) return "";
  if(unit === "g" && n >= 1000) return (n / 1000).toLocaleString("pt-BR") + " kg";
  if(unit === "ml" && n >= 1000) return (n / 1000).toLocaleString("pt-BR") + " L";
  return n.toLocaleString("pt-BR") + " " + unit;
}

const PACK_UNITS = [
  { value: "kg", label: "kg", mult: 1000, unit: "g"  },
  { value: "g",  label: "g",  mult: 1,    unit: "g"  },
  { value: "L",  label: "L",  mult: 1000, unit: "ml" },
  { value: "ml", label: "ml", mult: 1,    unit: "ml" },
  { value: "un", label: "un", mult: 1,    unit: "un" },
];

// The blank option is the default for a product nothing is known about, and
// it is deliberately NOT a silent "g": typing 1 while the box says 1 kg would
// store a gram of rice and nobody would notice until a recipe did the maths.
function unitOptions(selected){
  return '<option value=""' + (selected ? "" : " selected") + '>—</option>' +
    PACK_UNITS.map(u =>
      '<option value="' + u.value + '"' +
      (u.value === selected ? " selected" : "") + '>' + esc(u.label) + '</option>'
    ).join("");
}

// Stored pair -> the two fields, in the unit the packaging would use: 1500 g
// comes back as 1,5 + kg, not 1500 + g.
function netQtyToFields(qty, unit){
  const n = Number(qty);
  if(!Number.isFinite(n) || n <= 0 || !unit) return { qty: "", unit: "" };
  if(unit === "g"  && n >= 1000) return { qty: fmtQty(n / 1000), unit: "kg" };
  if(unit === "ml" && n >= 1000) return { qty: fmtQty(n / 1000), unit: "L" };
  return { qty: fmtQty(n), unit: unit };
}

// The two fields -> the stored pair. Returns null when there is nothing
// usable to store, so "blank" and "invalid" are one case for the caller.
function fieldsToNetQty(rawQty, rawUnit){
  const n = parseQtyInput(rawQty);
  const u = PACK_UNITS.find(x => x.value === rawUnit);
  if(n === null || !u) return null;
  return { net_qty: n * u.mult, net_unit: u.unit };
}

// Digits and at most ONE decimal separator, nothing else.
function sanitizeQtyInput(raw){
  let s = String(raw ?? "").replace(/[^\d.,]/g, "").replace(/\./g, ",");
  const first = s.indexOf(",");
  if(first !== -1) s = s.slice(0, first + 1) + s.slice(first + 1).replace(/,/g, "");
  return s;
}
function parseQtyInput(raw){
  const n = Number(String(raw ?? "").replace(",", "."));
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
}
function wireQtyInput(el){
  el.addEventListener("input", () => {
    const clean = sanitizeQtyInput(el.value);
    if(clean !== el.value) el.value = clean;
  });
  const selectAll = () => { try{ el.select(); }catch(_){ /* not focusable */ } };
  el.addEventListener("focus", selectAll);
  el.addEventListener("click", selectAll);
  el.addEventListener("pointerup", selectAll);
}

// Same SHOUTED-name rule checklist-api applies to product names, used here
// for the BRAND — brands are stored exactly as Open Food Facts supplied
// them and tidied at render.
const PT_SMALL_WORDS = ["de","da","do","das","dos","e","com","em","no","na",
  "nos","nas","a","o","as","os","ao","aos","para","sem","por","um","uma"];
function tidyShouted(raw){
  const s = String(raw || "").trim().replace(/\s+/g, " ");
  if(!s || /\p{Ll}/u.test(s)) return s;
  return s.toLowerCase().replace(/\S+/gu, (word, offset) =>
    (offset > 0 && PT_SMALL_WORDS.indexOf(word) >= 0)
      ? word
      : word.charAt(0).toUpperCase() + word.slice(1));
}

// Brand · size, the one-line identity of a catalogue row.
function productMeta(p){
  const bits = [];
  if(p.brand) bits.push(tidyShouted(p.brand));
  const size = fmtNetQty(p.net_qty, p.net_unit);
  if(size) bits.push(size);
  return bits.join(" · ");
}

function thumbHtml(p, cls){
  const c = "thumb" + (cls ? " " + cls : "");
  return p.image_url
    ? '<img class="' + c + '" src="' + esc(p.image_url) + '" alt="" loading="lazy">'
    : '<span class="' + c + ' ph">📦</span>';
}

// ---- ingredients ----
//
// The catalogue answers "which SKU is this barcode"; the ingredient answers
// "what is it", which is the question a recipe asks. Leite Ninho and Leite
// Piracanjuba are two products and one ingredient, and that link is what
// makes "tenho farinha suficiente?" answerable across brands.
//
// It is assigned by hand, deliberately. Open Food Facts does publish
// categories, but measured against this catalogue they group by dairy shelf
// rather than by what a recipe would substitute — creme de leite, leite em
// pó and leite condensado all come back under "milk and yogurt" — and 8 of
// 19 products have no category at all. A wrong link is worse than a blank
// one, so the household decides. The reasoning is in the API's own comment.
function ingredientName(p){
  return (p && p.ingredient && p.ingredient.name) ? p.ingredient.name : "";
}

function ingredientTagHtml(p){
  const name = ingredientName(p);
  return name
    ? '<span class="ing-tag">' + esc(name) + '</span>'
    : '<span class="ing-tag none">sem ingrediente</span>';
}

// Words worth matching a product name against, for the picker's suggestion.
// Two characters or fewer is noise ("de", "e"), and digits are sizes.
function nameWords(s){
  return String(s || "").toLowerCase()
    .replace(/[^\p{L}\s]/gu, " ")
    .split(/\s+/)
    .filter(w => w.length > 2 && PT_SMALL_WORDS.indexOf(w) < 0);
}

// An existing ingredient whose name shares a word with this product is very
// likely the right answer — a second brand of creme de leite finds the first
// one's ingredient without typing. Only a suggestion: it reorders the list,
// it never picks for you.
function looksLikely(ingName, productName){
  const words = nameWords(ingName);
  if(words.length === 0) return false;
  const target = " " + nameWords(productName).join(" ") + " ";
  return words.every(w => target.indexOf(" " + w + " ") >= 0);
}

// ---- catalogue screen ----

async function loadCatalog(){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  if(!getPass()){ showLogin(); return; }
  try{
    const data = await api("products");
    catalog = data.products || [];
    // A product deep-linked from Estoque opens straight on its detail
    // sheet; the catalogue is still loaded behind it so "← Catálogo"
    // has something to go back to.
    const wanted = new URLSearchParams(location.search).get("gtin");
    if(wanted){
      // Consumed once: a later reload of the catalogue is a deliberate
      // "back", not a request to reopen the same product forever.
      history.replaceState(null, "", location.pathname);
      openProduct(wanted);
      return;
    }
    renderCatalog();
  }catch(e){ handleAuthError(e, loadCatalog); }
}

// Name, brand and barcode all match, because all three are things someone
// might have in front of them — the box, the label, or the code itself.
function matchesSearch(p, term){
  if(!term) return true;
  const t = term.toLowerCase();
  if(String(p.name || "").toLowerCase().indexOf(t) >= 0) return true;
  if(String(p.brand || "").toLowerCase().indexOf(t) >= 0) return true;
  // The ingredient matches too, so "leite" finds every brand of it — which
  // is the whole reason the link exists.
  if(ingredientName(p).toLowerCase().indexOf(t) >= 0) return true;
  // Barcode search only when digits were actually typed: stripping
  // non-digits out of a word leaves "", and indexOf("") matches everything.
  const digits = t.replace(/\D/g, "");
  return digits !== "" && String(p.gtin || "").indexOf(digits) >= 0;
}

function productRowHtml(p){
  const meta = productMeta(p);
  const price = p.last_price != null ? fmtMoney(p.last_price) : "";
  const sub = [meta, price].filter(Boolean).join(" · ");
  // A row with no real OFF data yet — worth noticing without opening it,
  // but muted like the missing-barcode marker in shopping.html: this is a
  // normal, expected state, not an error.
  const flag = p.off_lookup_status
    ? '<span class="flag-ic" title="Sem dados do Open Food Facts">⚠️</span>'
    : '';
  return '<div class="row" data-gtin="' + esc(p.gtin) + '" style="cursor:pointer">' +
    thumbHtml(p) +
    '<span class="body">' +
      '<p class="txt">' + flag + esc(p.name) + '</p>' +
      (sub ? '<p class="meta">' + esc(sub) + '</p>' : '') +
      ingredientTagHtml(p) +
    '</span>' +
    '<span class="stock-badge' + (Number(p.qty) > 0 ? ' has' : '') + '">' +
      fmtQty(p.qty) + ' un' +
    '</span>' +
  '</div>';
}

function renderCatalog(){
  const shown = catalog.filter(p => matchesSearch(p, searchTerm));
  const rowsHtml = catalog.length === 0
    ? '<p class="msg">Nenhum produto no catálogo ainda. Eles entram sozinhos ao ' +
      'ler um código de barras na lista de compras.</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhum produto encontrado.</p>'
        : '<div class="card" id="cat-card">' + shown.map(productRowHtml).join("") + '</div>');

  root.innerHTML = navHeader("Produtos", null) +
    '<div class="searchrow">' +
      '<input type="search" id="search" placeholder="Buscar por nome, marca ou código" ' +
        'value="' + esc(searchTerm) + '">' +
    '</div>' +
    rowsHtml +
    '<p class="msg small">' + catalog.length + ' produto' +
      (catalog.length === 1 ? '' : 's') + ' no catálogo</p>';

  wireNav(null);

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    searchTerm = search.value.trim();
    // Only the list is redrawn, so the field keeps focus and the caret
    // while typing.
    const card = document.getElementById("cat-card") || document.getElementById("no-match");
    const next = catalog.filter(p => matchesSearch(p, searchTerm));
    const html = next.length === 0
      ? '<p class="msg" id="no-match">Nenhum produto encontrado.</p>'
      : '<div class="card" id="cat-card">' + next.map(productRowHtml).join("") + '</div>';
    if(card){
      card.outerHTML = html;
      wireCatalogRows();
    }
  });
  wireCatalogRows();
}

function wireCatalogRows(){
  root.querySelectorAll(".row[data-gtin]").forEach(row => {
    row.addEventListener("click", () => openProduct(row.dataset.gtin));
  });
}

// ---- price history graph ----
//
// One series, drawn by hand as inline SVG — ~40 lines, no library, keeping
// the page dependency-free like the rest of the app. Deliberately plain:
// a 2px accent line, dots big enough to tap, a recessive baseline, and
// labels only on the cheapest and dearest points rather than a number over
// every dot. The list underneath is the same data as text, which is what
// makes the chart safe to skip entirely.
// The plot band is deliberately shorter than the box: the cheapest point
// carries a label UNDER it, and the dates sit under that, so both need room
// that the line must not use.
const CHART_W = 320, CHART_H = 160;
const PLOT_TOP = 20, PLOT_BOT = 110, AXIS_Y = 136, DATE_Y = 152;
const CHART_L = 10, CHART_R = 310;

function priceChartHtml(prices){
  const pts = (prices || [])
    .map(p => ({ v: Number(p.price), t: new Date(p.captured_at).getTime(), raw: p }))
    .filter(p => Number.isFinite(p.v) && Number.isFinite(p.t));
  // One price is not a history: there is no shape to see, and a single dot
  // floating in an empty box reads as a broken chart.
  if(pts.length < 2) return "";

  const min = Math.min(...pts.map(p => p.v));
  const max = Math.max(...pts.map(p => p.v));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const spanT = t1 - t0 || 1;
  // A flat series would divide by zero; centring it vertically is the
  // honest picture of "this price never moved".
  const spanV = max - min;
  const x = p => CHART_L + ((p.t - t0) / spanT) * (CHART_R - CHART_L);
  const y = p => spanV === 0
    ? (PLOT_TOP + PLOT_BOT) / 2
    : PLOT_TOP + (1 - (p.v - min) / spanV) * (PLOT_BOT - PLOT_TOP);

  const path = pts.map((p, i) => (i ? "L" : "M") + x(p).toFixed(1) + " " + y(p).toFixed(1)).join(" ");
  const dots = pts.map((p, i) =>
    '<circle class="dot" cx="' + x(p).toFixed(1) + '" cy="' + y(p).toFixed(1) + '" r="4"></circle>' +
    // A separate, bigger, invisible target: a 4px dot is not a tap target.
    '<circle class="hit" cx="' + x(p).toFixed(1) + '" cy="' + y(p).toFixed(1) + '" r="14" ' +
      'data-i="' + i + '"></circle>'
  ).join("");

  // Only the extremes are labelled — the two numbers anyone actually wants
  // off a price series, rather than a number stamped over every dot. A flat
  // series gets one label, not two identical ones.
  const cheapest = pts.reduce((a, b) => (b.v < a.v ? b : a));
  const dearest = pts.reduce((a, b) => (b.v > a.v ? b : a));
  // A centred label on the first or last point hangs off the side of the
  // card, so the ones near an edge are anchored inwards instead.
  const label = (p, dy) => {
    const px = x(p);
    const anchor = px < 44 ? "start" : (px > CHART_W - 44 ? "end" : "middle");
    return '<text class="lbl val" x="' + px.toFixed(1) + '" y="' + (y(p) + dy).toFixed(1) + '" ' +
      'text-anchor="' + anchor + '">' + esc(fmtMoney(p.v)) + '</text>';
  };
  const labels = spanV === 0 ? label(pts[0], -11) : label(dearest, -11) + label(cheapest, 17);

  return '<div class="chart-wrap">' +
    '<svg class="chart" viewBox="0 0 ' + CHART_W + ' ' + CHART_H + '" role="img" ' +
      'aria-label="Variação de preço, de ' + esc(fmtMoney(min)) + ' a ' + esc(fmtMoney(max)) + '">' +
      '<line class="axis" x1="' + CHART_L + '" y1="' + AXIS_Y + '" ' +
        'x2="' + CHART_R + '" y2="' + AXIS_Y + '"></line>' +
      '<path class="line" d="' + path + '"></path>' +
      dots +
      labels +
      '<text class="lbl" x="' + CHART_L + '" y="' + DATE_Y + '" ' +
        'text-anchor="start">' + esc(fmtDate(pts[0].raw.captured_at)) + '</text>' +
      '<text class="lbl" x="' + CHART_R + '" y="' + DATE_Y + '" ' +
        'text-anchor="end">' + esc(fmtDate(pts[pts.length - 1].raw.captured_at)) + '</text>' +
    '</svg>' +
    '<div class="chart-tip" id="chart-tip"></div>' +
  '</div>';
}

// Tap or hover a point to read its date and price. An HTML chart is
// interactive by nature; without this the dots are decoration.
function wireChart(prices){
  const wrap = root.querySelector(".chart-wrap");
  if(!wrap) return;
  const tip = wrap.querySelector("#chart-tip");
  const svg = wrap.querySelector("svg");
  const pts = (prices || [])
    .map(p => ({ v: Number(p.price), t: new Date(p.captured_at).getTime(), raw: p }))
    .filter(p => Number.isFinite(p.v) && Number.isFinite(p.t));

  let hideTimer = null;
  const show = (hit) => {
    const i = Number(hit.getAttribute("data-i"));
    const p = pts[i];
    if(!p) return;
    tip.textContent = fmtDate(p.raw.captured_at) + " · " + fmtMoney(p.v);
    // The circle's own screen position, so the tip follows the point even
    // though the viewBox is stretched to the card's width.
    const box = hit.getBoundingClientRect();
    const wrapBox = wrap.getBoundingClientRect();
    tip.classList.add("show");
    // Kept inside the card: the tip is centred on its point, and the first
    // and last points are close enough to the edges that centring alone
    // would hang it off the side of the screen.
    const half = tip.offsetWidth / 2;
    const want = box.left + box.width / 2 - wrapBox.left;
    tip.style.left = Math.min(Math.max(want, half), wrapBox.width - half) + "px";
    tip.style.top = (box.top - wrapBox.top - 4) + "px";
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => tip.classList.remove("show"), 2400);
  };
  svg.querySelectorAll(".hit").forEach(hit => {
    hit.addEventListener("pointerenter", () => show(hit));
    hit.addEventListener("click", () => show(hit));
  });
}

// ---- product detail ----

// Two different flags for two different situations, per off_lookup_status:
// "not_found" means all four OFF sibling databases answered and none had
// this barcode — worth a link to go register it (the household already
// does this via the OFF app), AND a retry, because retrying right after
// registering is exactly how the real data gets pulled in without
// re-scanning. "lookup_incomplete" means at least one host never actually
// answered (timeout, an outage) — there is nothing to link to yet, since
// it isn't known whether OFF has it; only a retry makes sense.
function offFlagHtml(p){
  if(!p.off_lookup_status) return "";
  const offUrl = "https://world.openfoodfacts.org/product/" + encodeURIComponent(p.gtin);
  const notFound = p.off_lookup_status === "not_found";
  return '<div class="off-flag">' +
    '<span class="icon">' + (notFound ? "🔎" : "⚠️") + '</span>' +
    '<div class="body">' +
      '<p>' + (notFound
        ? 'Não encontrado em nenhuma base do Open Food Facts. Você pode ' +
          'cadastrar o produto por lá (app ou site) e depois puxar os dados ' +
          'aqui.'
        : 'Não foi possível consultar o Open Food Facts agora (a base pode ' +
          'estar fora do ar) — ainda não se sabe se o produto existe lá.'
      ) + '</p>' +
      '<div class="actions">' +
        (notFound
          ? '<a href="' + esc(offUrl) + '" target="_blank" rel="noopener">Abrir no OFF</a>'
          : '') +
        '<button id="off-retry">Tentar novamente</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function movementLabel(m){
  const map = {
    purchase: "Compra",
    unaccounted_purchase: "Compra não contabilizada",
    consumption: "Consumo",
    adjustment: "Ajuste de contagem",
  };
  return map[m.reason] || m.reason;
}

function movementRowHtml(m){
  const d = Number(m.delta);
  const cost = m.unit_cost != null ? " · " + fmtMoney(m.unit_cost) + "/un" : "";
  return '<div class="mov" data-mov="' + esc(m.id) + '">' +
    '<span class="delta ' + (d > 0 ? "up" : "down") + '">' +
      (d > 0 ? "+" : "−") + fmtQty(Math.abs(d)) + '</span>' +
    '<span class="what">' +
      esc(movementLabel(m)) +
      (m.reason === "unaccounted_purchase" ? '<span class="tag">retroativa</span>' : '') +
      '<p class="when">' + esc(fmtDateTime(m.occurred_at) + cost) + '</p>' +
    '</span>' +
    '<button class="icon-btn danger" data-del-mov title="Remover lançamento">🗑</button>' +
  '</div>';
}

async function openProduct(gtin){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  try{
    const data = await api("product_detail", { gtin });
    if(!data.found){
      root.innerHTML = navHeader("Produtos", loadCatalog) +
        '<p class="msg">Produto não encontrado.</p>';
      wireNav(loadCatalog);
      return;
    }
    renderProduct(data);
  }catch(e){ handleAuthError(e, loadCatalog); }
}

function renderProduct(data){
  const p = data.product;
  const meta = productMeta(p);
  const prices = data.prices || [];
  const movements = data.movements || [];
  // What the pantry holds in real units: 3 packs × 380 g. Only shown when
  // the package size is known, which is precisely what the editor below is
  // for when it isn't.
  const total = (Number(data.qty) > 0 && Number(p.net_qty) > 0 && p.net_unit)
    ? fmtNetQty(Number(data.qty) * Number(p.net_qty), p.net_unit)
    : "";

  const pricesHtml = prices.length === 0
    ? '<p class="msg small">Nenhum preço registrado ainda. Eles são capturados ao ' +
      'confirmar uma leitura de código de barras na lista de compras.</p>'
    : priceChartHtml(prices) +
      '<div class="card"><div class="plist">' +
        // Newest first in the list, while the chart runs left to right in
        // time — the list is a log, the chart is a shape.
        prices.slice().reverse().map(pr =>
          '<div class="prow">' +
            '<span class="when">' + esc(fmtDate(pr.captured_at)) +
              (pr.store ? " · " + esc(pr.store) : "") + '</span>' +
            '<span class="amount">' + esc(fmtMoney(pr.price)) + '</span>' +
          '</div>'
        ).join("") +
      '</div></div>';

  const movementsHtml = movements.length === 0
    ? '<p class="msg small">Nenhuma movimentação de estoque ainda.</p>'
    : '<div class="card" id="mov-card">' + movements.map(movementRowHtml).join("") + '</div>';

  root.innerHTML = navHeader("Produtos", loadCatalog) +
    '<div class="card pad">' +
      '<div class="prod-head">' +
        thumbHtml(p) +
        '<div class="prod-title">' +
          '<p class="name">' + esc(p.name) + '</p>' +
          (meta ? '<p class="sub">' + esc(meta) + '</p>' : '') +
          '<p class="code">' + esc(p.gtin) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="detail-actions">' +
        '<button class="primary small alt" id="edit-product">✎ Editar dados</button>' +
        '<button class="primary small alt danger" id="del-product">🗑 Remover</button>' +
      '</div>' +
      offFlagHtml(p) +
      '<div class="ing-line">' +
        '<span>' +
          '<p class="lbl">Ingrediente</p>' +
          '<p class="val' + (ingredientName(p) ? '' : ' none') + '">' +
            esc(ingredientName(p) || "não definido") + '</p>' +
        '</span>' +
        '<button class="link" id="set-ing">' +
          (ingredientName(p) ? 'Alterar' : 'Definir') + '</button>' +
      '</div>' +
      '<div class="stock-line">' +
        '<span>' +
          '<span class="big">' + fmtQty(data.qty) + '</span> ' +
          (Number(data.qty) === 1 ? 'pacote' : 'pacotes') +
          (total ? '<p class="sub">' + esc(total) + ' no total</p>' : '') +
        '</span>' +
        '<a class="link" href="estoque.html?gtin=' + encodeURIComponent(p.gtin) + '">Ajustar no estoque →</a>' +
      '</div>' +
    '</div>' +
    '<h3>Histórico de preço</h3>' +
    pricesHtml +
    '<h3>Movimentações</h3>' +
    movementsHtml;

  wireNav(loadCatalog);
  wireChart(prices);

  document.getElementById("edit-product").addEventListener("click", async () => {
    const edited = await productEditModal(p);
    if(!edited) return;
    try{
      await api("product_upsert", {
        gtin: p.gtin,
        name: edited.name,
        brand: edited.brand,
        net_qty: edited.size ? edited.size.net_qty : null,
        net_unit: edited.size ? edited.size.net_unit : null,
      });
      listToast("Produto atualizado");
      // The catalogue behind this sheet is now stale in the same fields.
      catalog = [];
      openProduct(p.gtin);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadCatalog);
      listToast("Não foi possível salvar", true);
    }
  });

  document.getElementById("set-ing").addEventListener("click", async () => {
    const chosen = await ingredientModal(p);
    if(!chosen) return;
    try{
      const res = await api("product_set_ingredient", { gtin: p.gtin, ...chosen.payload });
      listToast(chosen.payload.ingredient_id === null && !chosen.payload.ingredient_name
        ? "Ingrediente removido"
        : "Ingrediente: " + (res.product && res.product.ingredient
            ? res.product.ingredient.name : ""));
      // The catalogue behind this sheet now shows the wrong tag on this row,
      // and the picker's own list has a new entry and/or a stale count.
      catalog = [];
      ingredientCache = null;
      openProduct(p.gtin);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadCatalog);
      listToast("Não foi possível salvar o ingrediente", true);
    }
  });

  // Removing a product is the one destructive act on this page, and it takes
  // its price history and its pantry ledger with it (both foreign keys
  // cascade). So the API refuses the first attempt whenever there is
  // anything to lose and reports exactly what — the dialog below is built
  // from ITS numbers, not from this sheet, which may have been open a while.
  document.getElementById("del-product").addEventListener("click", async () => {
    if(!(await confirmModal(
      'Remover "' + (p.name || p.gtin) + '" do catálogo?', "Remover"))) return;
    try{
      let res = await api("product_delete", { gtin: p.gtin });
      if(res.ok === false && res.reason === "has_history"){
        const lost = [];
        if(Number(res.qty) !== 0){
          lost.push("ainda há " + fmtQty(res.qty) +
            (Number(res.qty) === 1 ? " pacote" : " pacotes") + " no estoque");
        }
        if(res.movements) lost.push(res.movements +
          (res.movements === 1 ? " movimentação" : " movimentações"));
        if(res.prices) lost.push(res.prices +
          (res.prices === 1 ? " preço registrado" : " preços registrados"));
        const itemsNote = res.items
          ? " " + res.items + (res.items === 1 ? " item de lista fica" : " itens de lista ficam") +
            " sem código de barras, mas não some" + (res.items === 1 ? "" : "m") + "."
          : "";
        if(!(await confirmModal(
          "Este produto tem histórico: " + lost.join(", ") + ". Removê-lo apaga " +
          "isso junto, e não dá para desfazer." + itemsNote,
          "Remover mesmo assim"))) return;
        res = await api("product_delete", { gtin: p.gtin, force: true });
      }
      listToast("Produto removido do catálogo");
      catalog = [];
      loadCatalog();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadCatalog);
      listToast("Não foi possível remover", true);
    }
  });

  const retryBtn = document.getElementById("off-retry");
  if(retryBtn){
    retryBtn.addEventListener("click", async () => {
      retryBtn.disabled = true;
      retryBtn.textContent = "Consultando…";
      try{
        const res = await api("product_retry_off", { gtin: p.gtin });
        // Whichever way it went, the flag (or its absence) may have
        // changed, so the catalogue behind this sheet is stale in that
        // field — same reasoning as after an edit.
        catalog = [];
        listToast(res.found
          ? "Dados atualizados do Open Food Facts"
          : (res.off_status === "not_found"
              ? "Ainda não encontrado no Open Food Facts"
              : "Não foi possível consultar agora"));
        openProduct(p.gtin);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadCatalog);
        retryBtn.disabled = false;
        retryBtn.textContent = "Tentar novamente";
        listToast("Não foi possível consultar agora", true);
      }
    });
  }

  root.querySelectorAll("[data-del-mov]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const row = btn.closest(".mov");
      if(!(await confirmModal(
        "Remover este lançamento? O estoque volta ao que era antes dele."))) return;
      // Removed from view first, put back if the API refuses — same
      // optimistic pattern the shopping list uses.
      const next = row.nextSibling, parent = row.parentNode;
      row.remove();
      try{
        await api("stock_movement_delete", { id: row.dataset.mov });
        openProduct(p.gtin);
      }catch(e){
        parent.insertBefore(row, next);
        if(e.unauthorized) return handleAuthError(e, loadCatalog);
        listToast("Não foi possível remover", true);
      }
    });
  });
}

// The catalogue editor: the second door onto name / brand / package size,
// for fixing a row without standing in a supermarket with the box in hand.
// Same two-control amount+unit pair as the scan dialog, mirroring how the
// values are STORED rather than asking for prose and parsing it back.
// Resolves with {name, brand, size} or null. `size` is null when the amount
// is blank, which means "no size known" — this dialog CAN clear it, unlike
// the scan dialog, because correcting metadata is the whole point here.
function productEditModal(p){
  const pack = netQtyToFields(p.net_qty, p.net_unit);
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Editar produto</h3>' +
        '<label for="pe-name">Nome do produto</label>' +
        '<input type="text" id="pe-name" value="' + esc(p.name || "") + '">' +
        '<label for="pe-brand">Marca (opcional)</label>' +
        '<input type="text" id="pe-brand" placeholder="ex: Nestlé" value="' +
          esc(tidyShouted(p.brand || "")) + '">' +
        '<label for="pe-net-qty">Peso / volume do pacote</label>' +
        '<div class="pack-fields">' +
          '<div class="col grow">' +
            '<span class="field">' +
              '<input class="num-input" type="text" inputmode="decimal" id="pe-net-qty" ' +
                'aria-label="Quantidade do pacote" placeholder="0" value="' + esc(pack.qty) + '">' +
            '</span>' +
          '</div>' +
          '<div class="col unit-col">' +
            '<select id="pe-net-unit" aria-label="Unidade do pacote">' + unitOptions(pack.unit) + '</select>' +
          '</div>' +
        '</div>' +
        '<p class="hint">Quanto vem em UM pacote. É o que transforma "3 pacotes" ' +
          'em "4,5 kg" no estoque e nas receitas.</p>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="pe-cancel">Cancelar</button>' +
          '<button class="save" id="pe-ok">Salvar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const nameEl = backdrop.querySelector("#pe-name");
    const brandEl = backdrop.querySelector("#pe-brand");
    const qtyEl = backdrop.querySelector("#pe-net-qty");
    const unitEl = backdrop.querySelector("#pe-net-unit");
    wireQtyInput(qtyEl);

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    const ok = () => {
      const name = nameEl.value.trim();
      if(!name){ alert("O nome não pode ficar vazio."); nameEl.focus(); return; }
      const rawQty = qtyEl.value.trim();
      let size = null;
      if(rawQty){
        size = fieldsToNetQty(rawQty, unitEl.value);
        // An amount with no unit is refused rather than defaulted to grams:
        // reading 1,5 as 1,5 g when the box says 1,5 kg would corrupt
        // exactly the number the recipe side exists to add up.
        if(!size){
          alert(unitEl.value
            ? "Quantidade do pacote inválida."
            : "Escolha a unidade do pacote (kg, g, L, ml ou un).");
          (unitEl.value ? qtyEl : unitEl).focus();
          return;
        }
      }
      close({ name, brand: brandEl.value.trim(), size });
    };
    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){ e.preventDefault(); ok(); }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#pe-cancel").addEventListener("click", () => close(null));
    backdrop.querySelector("#pe-ok").addEventListener("click", ok);
    nameEl.focus();
    nameEl.select();
  });
}

// The picker. One input doing double duty — it filters the existing
// ingredients as you type AND is the name of a new one — because those are
// the same question ("which ingredient is this?") and splitting them into
// two fields would make the common case (it already exists) the slower one.
//
// Resolves with {payload} ready to send to product_set_ingredient, or null.
// The list is fetched on first open rather than at page load: most visits
// to this page never touch it.
let ingredientCache = null;

function ingredientModal(p){
  return new Promise(async resolve => {
    let all;
    try{
      if(!ingredientCache) ingredientCache = (await api("ingredients")).ingredients || [];
      all = ingredientCache;
    }catch(e){
      if(e.unauthorized){ handleAuthError(e, loadCatalog); return resolve(null); }
      listToast("Não foi possível carregar os ingredientes", true);
      return resolve(null);
    }

    const currentId = p.ingredient ? p.ingredient.id : null;
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Ingrediente</h3>' +
        '<label for="ing-q">Buscar ou criar</label>' +
        '<input type="text" id="ing-q" placeholder="ex: leite condensado" autocomplete="off">' +
        '<p class="hint">O que este produto É, para as receitas. Marcas ' +
          'diferentes da mesma coisa compartilham o ingrediente — é assim que ' +
          '"tenho leite condensado?" passa a ter resposta.</p>' +
        '<div class="ing-list" id="ing-list"></div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="ing-cancel">Cancelar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const qEl = backdrop.querySelector("#ing-q");
    const listEl = backdrop.querySelector("#ing-list");

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };

    function draw(){
      const term = qEl.value.trim();
      const t = term.toLowerCase();
      const shown = all.filter(i => !t || String(i.name).toLowerCase().indexOf(t) >= 0);
      // A likely match floats to the top only while nothing has been typed —
      // once there is a filter, the user's own words rank the list.
      const ranked = t ? shown : shown.slice().sort((a, b) =>
        (looksLikely(b.name, p.name) ? 1 : 0) - (looksLikely(a.name, p.name) ? 1 : 0));
      const exact = all.some(i => String(i.name).toLowerCase() === t);

      let html = "";
      if(term && !exact){
        html += '<button class="ing-opt create" data-create>' +
          '<span class="nm">➕ Criar "' + esc(term) + '"</span></button>';
      }
      if(currentId){
        html += '<button class="ing-opt clear" data-clear>' +
          '<span class="nm">✕ Sem ingrediente</span></button>';
      }
      html += ranked.map(i =>
        '<button class="ing-opt' + (i.id === currentId ? ' current' : '') + '" ' +
          'data-pick="' + esc(i.id) + '">' +
          '<span class="nm">' + (i.id === currentId ? '✓ ' : '') + esc(i.name) + '</span>' +
          (!t && i.id !== currentId && looksLikely(i.name, p.name)
            ? '<span class="hintbadge">provável</span>' : '') +
          // How many products already point at it — the difference between
          // "this is the one we use" and a near-duplicate typed by mistake.
          '<span class="cnt">' + (i.product_count || 0) +
            ((i.product_count === 1) ? ' produto' : ' produtos') + '</span>' +
        '</button>').join("");
      if(!html){
        html = '<p class="msg small">Nenhum ingrediente ainda. Digite acima para criar o primeiro.</p>';
      }
      listEl.innerHTML = html;

      const create = listEl.querySelector("[data-create]");
      if(create){
        create.addEventListener("click", () =>
          close({ payload: { ingredient_name: qEl.value.trim() } }));
      }
      const clear = listEl.querySelector("[data-clear]");
      if(clear) clear.addEventListener("click", () => close({ payload: { ingredient_id: null } }));
      listEl.querySelectorAll("[data-pick]").forEach(btn => {
        btn.addEventListener("click", () => {
          // Picking the one already set is a no-op, not a write.
          if(btn.dataset.pick === currentId) return close(null);
          close({ payload: { ingredient_id: btn.dataset.pick } });
        });
      });
    }

    function onKey(e){
      if(e.key === "Escape") close(null);
      // Enter takes the obvious action: the first row of the list, which is
      // "create" when the typed name is new and the best match when it isn't.
      if(e.key === "Enter"){
        e.preventDefault();
        const first = listEl.querySelector(".ing-opt");
        if(first) first.click();
      }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#ing-cancel").addEventListener("click", () => close(null));
    qEl.addEventListener("input", draw);
    draw();
    qEl.focus();
  });
}

loadCatalog();
</script>
</body>
</html>

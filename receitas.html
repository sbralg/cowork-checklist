<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receitas">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Receitas</title>
<!--
  Data-free shell for the Receitas module — a formula that turns Insumos
  (via the abstract ingredient, not a specific brand) and optionally other
  Receitas into a costed, yielded thing. Ported from the household's real
  spreadsheet (Precificação Produtos Magá.xlsm) — see checklist-api's
  receitaCostFor for the exact formula this page renders.

  A recipe line references the abstract INGREDIENT, not a specific insumo:
  cost resolves to whichever insumo under that ingredient was most recently
  actually stocked (see ingredient_last_cost() server-side), even if it's
  currently at zero balance. An ingredient with no purchase history at all
  shows up in "incomplete" rather than silently costing 0.

  Same pattern as every other page here: hosted on public GitHub Pages,
  holds NO keys and NO data, asks for the shared passphrase, then talks
  only to the gated Supabase Edge Function (checklist-api).
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<style>
  body{ padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 8px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  .subheader{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;margin:0 0 8px}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h3{font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--muted)}
  .searchrow{display:flex;gap:8px;margin:0 0 14px}
  .searchrow input[type=search]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    -webkit-appearance:none;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .15s ease}
  .row:hover{background:rgba(127,127,127,.06)}
  .row:last-child{border-bottom:none}
  .row .nm{font-size:15px;font-weight:600;margin:0;word-wrap:break-word}
  .row .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0}
  .addrow-btn{margin:8px 0 0}
  button.primary.full{width:100%}
  /* ---- detail ---- */
  .rec-title{font-size:16px;font-weight:650;margin:0;text-align:right;word-wrap:break-word;cursor:pointer}
  .rec-title:hover{opacity:.75}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .scale-card{padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .scale-card label{font-size:13px;color:var(--muted);flex:1;min-width:140px}
  .scale-card .field{max-width:120px}
  .item-row{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);
  }
  .item-row:last-child{border-bottom:none}
  .item-row .badge{font-size:18px;flex:none;width:24px;text-align:center}
  .item-row .body{flex:1;min-width:0}
  .item-row .body .txt{font-size:14.5px;margin:0;word-wrap:break-word}
  .item-row .body .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .item-row .scaled{font-size:12.5px;color:var(--accent);margin:2px 0 0}
  .row-actions{display:flex;gap:2px;flex:none}
  .totals-card{padding:14px}
  .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .totals-grid .t{grid-column:1 / -1;border-top:1px solid var(--border);margin-top:2px;padding-top:10px}
  .totals-grid .lbl{font-size:12px;color:var(--muted);margin:0}
  .totals-grid .val{font-size:16px;font-weight:650;margin:2px 0 0}
  .warn-card{padding:12px 14px;background:rgba(180,83,9,.1);border-radius:12px;margin-top:10px}
  .warn-card p{font-size:13px;color:var(--warn);margin:0}
  /* ---- shared produto panel (packaging/margins/reverse calc) ---- */
  .reverse-card{padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .reverse-card label{font-size:13px;color:var(--muted);flex:1;min-width:140px}
  .reverse-card .field{max-width:120px}
  .reverse-out{font-size:13px;color:var(--text);margin:10px 0 0;width:100%}
  .reverse-out p{margin:2px 0}
  /* ---- item picker ---- */
  .kind-tabs{display:flex;gap:6px;margin:0 0 12px}
  .kind-tab{
    flex:1;font-size:13px;font-weight:600;padding:9px;border-radius:10px;cursor:pointer;
    background:rgba(127,127,127,.1);color:var(--muted);border:none;transition:background-color .15s ease,color .15s ease;
  }
  .kind-tab.active{background:var(--accent);color:var(--accent-text)}
  .pick-list{max-height:38vh;overflow-y:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
  .pick-opt{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    color:var(--text);font:inherit;font-size:15px;padding:11px 4px;cursor:pointer;
    transition:background-color .15s ease;
  }
  .pick-opt:last-child{border-bottom:none}
  .pick-opt:hover{background:rgba(127,127,127,.08)}
  .pick-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let receitas = [];
let searchTerm = "";
let ingredientCache = null;
let receitaListCache = null;

const PAGE_LOGIN = {
  title: "Receitas",
  subtitle: "Digite a senha para acessar.",
  onSuccess: () => loadReceitas(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-produto-panel.js"></script>
<script>

const CURRENT_PAGE = "receitas";
const YIELD_UNITS = ["g", "ml", "un"];

function navHeader(title, backAction){
  const topRow = '<header><div class="hleft">' +
    '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
    '<h1 style="flex:1">' + (backAction ? 'Receitas' : esc(title)) + '</h1>' +
    '</div></header>';
  if(!backAction) return topRow;
  return topRow + '<div class="subheader">' +
    '<button class="link" id="back">← Receitas</button>' +
    (title ? '<h2 class="rec-title" id="rec-name">' + esc(title) + '</h2>' : '') +
  '</div>';
}
function wireNav(backAction){
  wireMenuButton();
  if(backAction) document.getElementById("back").addEventListener("click", backAction);
}

function pct(v){ return (Number(v) * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }); }

// ---- list screen ----

async function loadReceitas(){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  if(!getPass()){ showLogin(); return; }
  try{
    const data = await api("receitas");
    receitas = data.receitas || [];
    const wanted = new URLSearchParams(location.search).get("id");
    if(wanted){
      history.replaceState(null, "", location.pathname);
      openReceita(wanted);
      return;
    }
    renderList();
  }catch(e){ handleAuthError(e, loadReceitas); }
}

function matchesSearch(r, term){
  if(!term) return true;
  return String(r.name).toLowerCase().indexOf(term.toLowerCase()) >= 0;
}

function receitaRowHtml(r){
  return '<div class="row" data-id="' + esc(r.id) + '">' +
    '<div>' +
      '<p class="nm">' + esc(r.name) + '</p>' +
      '<p class="meta">' + fmtStockQty(r.yield_qty) + ' ' + esc(r.yield_unit) +
        ' · ' + r.item_count + (r.item_count === 1 ? ' item' : ' itens') + '</p>' +
    '</div>' +
  '</div>';
}

function renderList(){
  const shown = receitas.filter(r => matchesSearch(r, searchTerm));
  const rowsHtml = receitas.length === 0
    ? '<p class="msg">Nenhuma receita ainda. Toque em "+ Nova receita" para começar.</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhuma receita encontrada.</p>'
        : '<div class="card" id="list-card">' + shown.map(receitaRowHtml).join("") + '</div>');

  root.innerHTML = navHeader("Receitas", null) +
    '<div class="searchrow"><input type="search" id="search" placeholder="Buscar receita" ' +
      'value="' + esc(searchTerm) + '"></div>' +
    rowsHtml +
    '<button class="primary full addrow-btn" id="new-receita">+ Nova receita</button>';

  wireNav(null);
  const search = document.getElementById("search");
  search.addEventListener("input", () => { searchTerm = search.value.trim(); redrawList(); });
  wireListRows();
  document.getElementById("new-receita").addEventListener("click", () => openReceitaModal(null));
}

function redrawList(){
  const shown = receitas.filter(r => matchesSearch(r, searchTerm));
  const card = document.getElementById("list-card") || document.getElementById("no-match");
  const html = shown.length === 0
    ? '<p class="msg" id="no-match">Nenhuma receita encontrada.</p>'
    : '<div class="card" id="list-card">' + shown.map(receitaRowHtml).join("") + '</div>';
  if(card){ card.outerHTML = html; wireListRows(); }
}

function wireListRows(){
  root.querySelectorAll(".row[data-id]").forEach(row => {
    row.addEventListener("click", () => openReceita(row.dataset.id));
  });
}

// ---- create/edit modal ----

function openReceitaModal(r){
  const isEdit = !!r;
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>' + (isEdit ? "Editar receita" : "Nova receita") + '</h3>' +
      '<label for="rec-name-i">Nome</label>' +
      '<input type="text" id="rec-name-i" value="' + esc(isEdit ? r.name : "") + '">' +
      '<div class="fields-row">' +
        '<div class="col grow">' +
          '<label for="rec-yield">Rendimento</label>' +
          '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="rec-yield" ' +
            'value="' + esc(isEdit ? fmtStockQty(r.yield_qty) : "") + '"></span>' +
        '</div>' +
        '<div class="col grow">' +
          '<label for="rec-unit">Medida</label>' +
          '<select id="rec-unit" style="width:100%">' +
            YIELD_UNITS.map(u => '<option value="' + u + '"' +
              (isEdit && r.yield_unit === u ? " selected" : "") + '>' + u + '</option>').join("") +
          '</select>' +
        '</div>' +
      '</div>' +
      '<label for="rec-margin">Margem de segurança (%, opcional)</label>' +
      '<input type="text" id="rec-margin" inputmode="decimal" ' +
        'value="' + esc(isEdit && r.safety_margin_pct ? pct(r.safety_margin_pct) : "") + '">' +
      '<div class="fields-row">' +
        '<div class="col grow">' +
          '<label for="rec-prep-min">Preparo (min, opcional)</label>' +
          '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="rec-prep-min" ' +
            'value="' + esc(isEdit && r.prep_minutes ? fmtStockQty(r.prep_minutes) : "") + '"></span>' +
        '</div>' +
        '<div class="col grow">' +
          '<label for="rec-prep-rate">Mão de obra (R$/h, opcional)</label>' +
          '<span class="field"><span class="prefix">R$</span>' +
            '<input class="num-input" type="text" inputmode="numeric" id="rec-prep-rate" ' +
            'value="' + esc(isEdit ? fmtPriceInput(r.labor_rate_per_hour) : "") + '"></span>' +
        '</div>' +
      '</div>' +
      '<label for="rec-notes">Notas (opcional)</label>' +
      '<input type="text" id="rec-notes" value="' + esc(isEdit ? (r.notes || "") : "") + '">' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="rec-cancel">Cancelar</button>' +
        '<button class="save" id="rec-ok">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const yieldEl = backdrop.querySelector("#rec-yield");
  const marginEl = backdrop.querySelector("#rec-margin");
  const prepMinEl = backdrop.querySelector("#rec-prep-min");
  const prepRateEl = backdrop.querySelector("#rec-prep-rate");
  wireQtyInput(yieldEl);
  wireQtyInput(marginEl);
  wireQtyInput(prepMinEl);
  wirePriceInput(prepRateEl);

  const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  backdrop.querySelector("#rec-cancel").addEventListener("click", close);

  backdrop.querySelector("#rec-ok").addEventListener("click", async () => {
    const name = backdrop.querySelector("#rec-name-i").value.trim();
    if(!name){ alert("O nome não pode ficar vazio."); return; }
    const yieldQty = parseQtyInput(yieldEl.value);
    if(yieldQty === null){ alert("Rendimento inválido."); return; }
    const marginRaw = parseQtyInput(marginEl.value);
    const payload = {
      name,
      yield_qty: yieldQty,
      yield_unit: backdrop.querySelector("#rec-unit").value,
      safety_margin_pct: marginRaw === null ? 0 : marginRaw / 100,
      prep_minutes: parseQtyInput(prepMinEl.value),
      labor_rate_per_hour: centsToPrice(priceDigits(prepRateEl.value)),
      notes: backdrop.querySelector("#rec-notes").value.trim() || null,
    };
    try{
      if(isEdit){
        await api("receita_update", Object.assign({ id: r.id }, payload));
        close();
        listToast("Receita atualizada");
        openReceita(r.id);
      }else{
        const res = await api("receita_create", payload);
        close();
        receitas = [];
        openReceita(res.receita.id);
      }
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadReceitas);
      listToast("Não foi possível salvar", true);
    }
  });

  backdrop.querySelector("#rec-name-i").focus();
}

// ---- item picker (ingrediente ou receita, com quantidade) ----

async function receitaItemPickerModal(currentReceitaId){
  let ings, recs;
  try{
    if(!ingredientCache) ingredientCache = (await api("ingredients")).ingredients || [];
    if(!receitaListCache) receitaListCache = (await api("receitas")).receitas || [];
    ings = ingredientCache.filter(i => i.kind !== "embalagem");
    recs = receitaListCache.filter(r => r.id !== currentReceitaId);
  }catch(e){
    if(e.unauthorized){ handleAuthError(e, () => openReceita(currentReceitaId)); return null; }
    listToast("Não foi possível carregar", true);
    return null;
  }

  return new Promise(resolve => {
    let kind = "ingrediente";
    let picked = null; // { id, name, unit }

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = '<div class="modal-card" id="pick-card"></div>';
    document.body.appendChild(backdrop);
    const card = backdrop.querySelector("#pick-card");

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };

    function drawPickStep(){
      card.innerHTML =
        '<h3>Adicionar item</h3>' +
        '<div class="kind-tabs">' +
          '<button class="kind-tab' + (kind === "ingrediente" ? " active" : "") + '" data-kind="ingrediente">🧂 Ingrediente</button>' +
          '<button class="kind-tab' + (kind === "receita" ? " active" : "") + '" data-kind="receita">📖 Receita</button>' +
        '</div>' +
        '<input type="text" id="pick-q" placeholder="Buscar" autocomplete="off">' +
        '<div class="pick-list" id="pick-list"></div>' +
        '<div class="modal-actions"><button class="cancel" id="pick-cancel">Cancelar</button></div>';

      const qEl = card.querySelector("#pick-q");
      const listEl = card.querySelector("#pick-list");
      const source = kind === "ingrediente" ? ings : recs;

      function draw(){
        const t = qEl.value.trim().toLowerCase();
        const shown = source.filter(x => !t || String(x.name).toLowerCase().indexOf(t) >= 0);
        let html = shown.map(x => {
          const sub = kind === "ingrediente"
            ? (x.base_unit ? "por " + x.base_unit : "")
            : (fmtStockQty(x.yield_qty) + " " + x.yield_unit);
          return '<button class="pick-opt" data-id="' + esc(x.id) + '">' +
            '<span class="nm">' + esc(x.name) + '</span>' +
            (sub ? '<span class="cnt">' + esc(sub) + '</span>' : '') +
          '</button>';
        }).join("");
        if(!html){
          html = '<p class="msg small">' +
            (kind === "ingrediente"
              ? "Nenhum ingrediente ainda. Vincule um insumo a um ingrediente em Insumos primeiro."
              : "Nenhuma outra receita ainda.") +
            '</p>';
        }
        listEl.innerHTML = html;
        listEl.querySelectorAll("[data-id]").forEach(btn => {
          btn.addEventListener("click", () => {
            const x = source.find(s => s.id === btn.dataset.id);
            picked = { id: x.id, name: x.name, unit: kind === "ingrediente" ? (x.base_unit || "") : x.yield_unit };
            drawQtyStep();
          });
        });
      }

      card.querySelectorAll("[data-kind]").forEach(btn => {
        btn.addEventListener("click", () => { kind = btn.dataset.kind; drawPickStep(); });
      });
      card.querySelector("#pick-cancel").addEventListener("click", () => close(null));
      qEl.addEventListener("input", draw);
      draw();
      qEl.focus();
    }

    function drawQtyStep(){
      card.innerHTML =
        '<h3>Quantidade</h3>' +
        '<p class="who">' + esc(picked.name) + '</p>' +
        '<label for="pick-qty">Quantidade' + (picked.unit ? " (" + esc(picked.unit) + ")" : "") + '</label>' +
        '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pick-qty" value=""></span>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="qty-back">Voltar</button>' +
          '<button class="save" id="qty-ok">Adicionar</button>' +
        '</div>';
      const qtyEl = card.querySelector("#pick-qty");
      wireQtyInput(qtyEl);
      card.querySelector("#qty-back").addEventListener("click", drawPickStep);
      const ok = () => {
        const quantity = parseQtyInput(qtyEl.value);
        if(quantity === null){ alert("Quantidade inválida."); return; }
        close({
          kind,
          ingredient_id: kind === "ingrediente" ? picked.id : undefined,
          sub_receita_id: kind === "receita" ? picked.id : undefined,
          quantity,
        });
      };
      card.querySelector("#qty-ok").addEventListener("click", ok);
      qtyEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); ok(); } });
      qtyEl.focus();
    }

    function onKey(e){ if(e.key === "Escape") close(null); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    drawPickStep();
  });
}

// ---- detail screen ----

async function openReceita(id){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  try{
    const data = await api("receita_detail", { id });
    if(!data.found){
      root.innerHTML = navHeader("", loadReceitas) + '<p class="msg">Receita não encontrada.</p>';
      wireNav(loadReceitas);
      return;
    }
    renderReceita(data);
  }catch(e){ handleAuthError(e, loadReceitas); }
}

function itemRowHtml(it, scale, itemCosts){
  const isIng = it.kind === "ingrediente";
  const target = isIng ? it.ingredient : it.sub_receita;
  const unit = isIng ? (target && target.base_unit) || "" : (target && target.yield_unit) || "";
  const scaledHtml = (scale && scale !== 1)
    ? '<p class="scaled">Para o rendimento desejado: ' + fmtStockQty(it.quantity * scale) + ' ' + unit + '</p>'
    : '';
  // "Custo por unidade" / "custo do ingrediente" — the spreadsheet's own
  // per-row columns, resolved server-side in receitaCostFor's item_costs.
  const ic = (itemCosts || {})[it.id];
  const costHtml = ic
    ? '<p class="meta">' + fmtMoney(ic.unit_cost) + '/' + esc(unit || "un") +
        ' · ' + fmtMoney(scale && scale !== 1 ? ic.line_cost * scale : ic.line_cost) + '</p>'
    : '';
  return '<div class="item-row" data-item="' + esc(it.id) + '">' +
    '<span class="badge">' + (isIng ? "🧂" : "📖") + '</span>' +
    '<span class="body">' +
      '<p class="txt">' + esc(target ? target.name : "?") + '</p>' +
      '<p class="meta">' + fmtStockQty(it.quantity) + ' ' + esc(unit) + '</p>' +
      scaledHtml +
      costHtml +
    '</span>' +
    '<span class="row-actions">' +
      '<button class="icon-btn" data-edit-item title="Editar quantidade">✎</button>' +
      '<button class="icon-btn danger" data-del-item title="Remover">🗑</button>' +
    '</span>' +
  '</div>';
}

function renderReceita(data){
  const r = data.receita;
  const itens = data.itens || [];
  const cost = data.cost;
  const incomplete = data.incomplete || [];
  const itemCosts = cost && cost.item_costs;

  const itensHtml = itens.length === 0
    ? '<p class="msg small">Nenhum item ainda.</p>'
    : '<div class="card" id="itens-card">' +
        itens.map(it => itemRowHtml(it, currentScale(), itemCosts)).join("") +
      '</div>';

  const costHtml = cost
    ? '<div class="card totals-card">' +
        '<div class="totals-grid">' +
          '<div><p class="lbl">Custo da fornada</p><p class="val">' + fmtMoney(cost.batch_cost) + '</p></div>' +
          '<div><p class="lbl">Com margem de segurança</p><p class="val">' + fmtMoney(cost.batch_cost_with_margin) + '</p></div>' +
          (cost.prep_labor_cost > 0
            ? '<div><p class="lbl">Mão de obra (preparo)</p><p class="val">' + fmtMoney(cost.prep_labor_cost) + '</p></div>'
            : '') +
          '<div class="t"><p class="lbl">Custo por ' + esc(r.yield_unit) + '</p><p class="val">' +
            fmtMoney(cost.cost_per_yield_unit) + '</p></div>' +
        '</div>' +
      '</div>'
    : '';
  const warnHtml = incomplete.length > 0
    ? '<div class="warn-card"><p>⚠️ Custo incompleto — sem histórico de compra: ' + esc(incomplete.join(", ")) + '</p></div>'
    : '';

  root.innerHTML = navHeader(r.name, loadReceitas) +
    '<p class="meta" style="text-align:right;color:var(--muted);font-size:13px;margin:-4px 0 8px">' +
      'Rendimento: ' + fmtStockQty(r.yield_qty) + ' ' + esc(r.yield_unit) +
      (r.safety_margin_pct ? ' · margem de segurança ' + pct(r.safety_margin_pct) + '%' : '') +
    '</p>' +
    '<div class="detail-actions">' +
      '<button class="primary small alt" id="edit-receita">✎ Editar</button>' +
      '<button class="primary small alt danger" id="del-receita">🗑 Remover</button>' +
    '</div>' +
    costHtml + warnHtml +
    '<div class="card scale-card">' +
      '<label for="scale-yield">Rendimento desejado (para calcular quantidades de uma fornada maior — não é salvo)</label>' +
      '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="scale-yield" placeholder="' +
        fmtStockQty(r.yield_qty) + '"></span>' +
    '</div>' +
    '<h3>Itens</h3>' + itensHtml +
    '<button class="primary small alt addrow-btn" id="add-item">+ Item</button>' +
    '<h3>Categoria</h3>' +
    '<div id="rec-categoria"></div>';

  wireNav(loadReceitas);

  document.getElementById("rec-name").addEventListener("click", () => openReceitaModal(r));
  document.getElementById("edit-receita").addEventListener("click", () => openReceitaModal(r));

  document.getElementById("del-receita").addEventListener("click", async () => {
    if(!(await confirmModal('Remover a receita "' + r.name + '"?', "Remover"))) return;
    try{
      await api("receita_delete", { id: r.id });
      receitas = [];
      receitaListCache = null;
      listToast("Receita removida");
      loadReceitas();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadReceitas);
      let msg = "Não foi possível remover";
      if(e.badRequest){
        msg = "Esta receita está em uso" +
          " — não é possível remover enquanto estiver vinculada a outra receita ou a um produto.";
      }
      listToast(msg, true);
    }
  });

  const scaleEl = document.getElementById("scale-yield");
  wireQtyInput(scaleEl);
  scaleEl.addEventListener("input", () => redrawItems(data));

  document.getElementById("add-item").addEventListener("click", async () => {
    const added = await receitaItemPickerModal(r.id);
    if(!added) return;
    try{
      await api("receita_item_add", Object.assign({ receita_id: r.id }, added));
      receitas = [];
      openReceita(r.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadReceitas);
      listToast(e.badRequest ? "Não foi possível adicionar (verifique o item)" : "Não foi possível adicionar", true);
    }
  });
  wireItemRowActions(data);
  renderCategoria(data);
}

// "Categoria" isn't a stored field on the receita — it's just whether a
// manufaturado Produto already points back at it (receita_detail's
// linked_produto). Picking "Produto Final" here creates that Produto on
// the spot with sane defaults; produtos.html can still edit/create one too
// (same record either way) — this is just the more direct path, matching
// the spreadsheet where every recipe tab already carries its own pricing
// panel.
function renderCategoria(data){
  const r = data.receita;
  const lp = data.linked_produto;
  const el = document.getElementById("rec-categoria");
  if(!el) return;

  if(!lp){
    el.innerHTML =
      '<div class="kind-tabs">' +
        '<button class="kind-tab active" disabled>🧂 Ingrediente</button>' +
        '<button class="kind-tab" id="cat-produto-final">🏷️ Produto Final</button>' +
      '</div>' +
      '<p class="msg small">Esta receita só é usada como ingrediente de outras receitas. ' +
      'Marque "Produto Final" para vendê-la, com embalagem, margens e preço sugerido.</p>';
    el.querySelector("#cat-produto-final").addEventListener("click", async () => {
      try{
        await api("produto_create", {
          name: r.name, kind: "manufaturado", receita_id: r.id, items_per_package: 1,
        });
        receitas = [];
        openReceita(r.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadReceitas);
        listToast("Não foi possível criar o produto", true);
      }
    });
    return;
  }

  el.innerHTML =
    '<div class="kind-tabs">' +
      '<button class="kind-tab" id="cat-ingrediente">🧂 Ingrediente</button>' +
      '<button class="kind-tab active" disabled>🏷️ Produto Final</button>' +
    '</div>' +
    '<p class="meta" style="margin:0 0 10px">' +
      '<a class="link" href="produtos.html?id=' + esc(lp.id) + '">Editar embalagem, mão de obra e margens em Produtos →</a>' +
    '</p>' +
    '<div id="rec-produto-panel"><p class="msg small">Carregando…</p></div>';

  el.querySelector("#cat-ingrediente").addEventListener("click", async () => {
    if(!(await confirmModal(
      'Remover "' + lp.name + '" de Produtos? A receita continua existindo, apenas deixa de ser vendável.',
      "Remover produto",
    ))) return;
    try{
      await api("produto_delete", { id: lp.id });
      receitas = [];
      openReceita(r.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadReceitas);
      listToast("Não foi possível remover", true);
    }
  });

  // The panel needs the linked produto's own embalagens/cost, which
  // receita_detail doesn't carry (it would just duplicate produto_detail's
  // work for the common case where no produto exists yet) — one extra
  // round trip only when a Produto Final is actually linked.
  (async () => {
    let pd;
    try{
      pd = await api("produto_detail", { id: lp.id });
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadReceitas);
      listToast("Não foi possível carregar o produto", true);
      return;
    }
    if(!pd.found) return;
    renderProdutoPanel(document.getElementById("rec-produto-panel"), {
      produto: pd.produto, embalagens: pd.embalagens || [], cost: pd.cost,
      incomplete: pd.incomplete || [],
      onChanged: () => { receitas = []; openReceita(r.id); },
      onAuthError: (e) => handleAuthError(e, loadReceitas),
    });
  })();
}

function currentScale(){
  const el = document.getElementById("scale-yield");
  if(!el) return 1;
  const desired = parseQtyInput(el.value);
  return desired ? desired : 1;
}

function redrawItems(data){
  const scaleRaw = document.getElementById("scale-yield").value;
  const desired = parseQtyInput(scaleRaw);
  const scale = desired ? desired / Number(data.receita.yield_qty) : 1;
  const itens = data.itens || [];
  const itemCosts = data.cost && data.cost.item_costs;
  const card = document.getElementById("itens-card");
  if(!card) return;
  // The wrapping div (and its id) must survive the redraw, or the NEXT
  // scale-input event finds nothing to update — only innerHTML changes.
  card.innerHTML = itens.map(it => itemRowHtml(it, scale, itemCosts)).join("");
  wireItemRowActions(data);
}

function wireItemRowActions(data){
  const r = data.receita;
  const itens = data.itens || [];
  root.querySelectorAll("[data-edit-item]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.closest(".item-row").dataset.item;
      const it = itens.find(x => x.id === id);
      const target = it.kind === "ingrediente" ? it.ingredient : it.sub_receita;
      const unit = it.kind === "ingrediente" ? (target && target.base_unit) : (target && target.yield_unit);
      const val = await promptModal("Editar quantidade", "Quantidade" + (unit ? " (" + unit + ")" : ""), fmtStockQty(it.quantity));
      if(val === null) return;
      const quantity = parseQtyInput(val);
      if(quantity === null){ listToast("Quantidade inválida", true); return; }
      try{
        await api("receita_item_update", { id, quantity });
        receitas = [];
        openReceita(r.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadReceitas);
        listToast("Não foi possível salvar", true);
      }
    });
  });
  root.querySelectorAll("[data-del-item]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!(await confirmModal("Remover este item?"))) return;
      const id = btn.closest(".item-row").dataset.item;
      try{
        await api("receita_item_delete", { id });
        receitas = [];
        openReceita(r.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadReceitas);
        listToast("Não foi possível remover", true);
      }
    });
  });
}

loadReceitas();
</script>
</body>
</html>
